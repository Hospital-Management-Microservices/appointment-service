# =============================================
# Appointment Service - application.properties
# =============================================

# Server Port
server.port=8083

# Application Name
spring.application.name=appointment-service

# =============================================
# Neon.tech PostgreSQL Database Configuration
# =============================================
# REPLACE the values below with YOUR actual Neon.tech credentials
# Get these from: Neon Dashboard → Your Project → Connection Details

# Neon PostgreSQL Connection Settings
spring.datasource.url=jdbc:postgresql://ep-restless-bar-a12oazt0-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_5wYpUcILGti6
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate Settings
# =============================================
# "update" = automatically creates/updates tables in your DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# springdoc api-docs path MUST be /api-docs (the standard default).
# The gateway rewrites /appointments/api-docs → /api-docs before forwarding,
# so the service must serve the spec at the plain /api-docs path.
# Direct (raw):  http://localhost:8083/api-docs
# Gateway:       http://localhost:8080/appointments/api-docs  → /api-docs on port 8083
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =============================================
# Other Services URLs (via API Gateway)
# When running locally, all services go through gateway at :8080
# =============================================
patient.service.url=http://localhost:8080/patients
doctor.service.url=http://localhost:8080/doctors
department.service.url=http://localhost:8080/departments
